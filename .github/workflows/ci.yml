name: Mi primer CI

on:
    push:
        branches:             
           - main
jobs:
    verificar:
        runs-on: ubuntu-latest

        steps:
            - name: Descargar código
              uses: actions/checkout@v4

            - name: Verificar html
              run: test -f index.html
            
            - name: instalar htmlhint
              run: npm install -g htmlhint

            - name: Validar sintaxis HTML
              run: htmlhint index.html
